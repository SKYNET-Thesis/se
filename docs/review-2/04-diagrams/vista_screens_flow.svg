<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="45" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">VISTA Platform — Screens &amp; User Navigation Flow</text>
  <text x="640" y="70" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Role-scoped UI Navigation Routes (Section 3.1.1 Screens Flow)</text>

  <!-- PUBLIC / AUTH GATE -->
  <g filter="url(#shadow)">
    <rect x="50" y="325" width="150" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="2" />
    <text x="125" y="355" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Login Screen</text>
    <text x="125" y="375" font-size="11" fill="#64748B" text-anchor="middle">Supabase JWT Gate</text>
  </g>

  <!-- Branching Arrows from Login -->
  <!-- To Student -->
  <path d="M 200 345 C 240 345, 240 170, 275 170" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" />
  <!-- To Teacher -->
  <path d="M 200 360 L 275 360" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
  <!-- To School Admin -->
  <path d="M 200 375 C 240 375, 240 550, 275 550" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- ==================== 1. STUDENT FLOW (TOP) ==================== -->
  <rect x="260" y="100" width="980" height="140" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
  <text x="280" y="128" font-size="14" font-weight="700" fill="#1D4ED8">STUDENT WORKFLOW (WF-02 &amp; WF-03)</text>

  <!-- S1: My Learning -->
  <g filter="url(#shadow)">
    <rect x="285" y="145" width="145" height="65" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="357" y="173" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">My Learning</text>
    <text x="357" y="193" font-size="11" fill="#64748B" text-anchor="middle">Enrolled Courses</text>
  </g>
  <line x1="430" y1="177" x2="475" y2="177" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- S2: Lesson & Assignment Detail -->
  <g filter="url(#shadow)">
    <rect x="480" y="145" width="155" height="65" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="557" y="173" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">Assignment Detail</text>
    <text x="557" y="193" font-size="11" fill="#64748B" text-anchor="middle">Task Brief &amp; Criteria</text>
  </g>
  <line x1="635" y1="177" x2="675" y2="177" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- S3: Blockly Coding Workspace -->
  <g filter="url(#shadow)">
    <rect x="680" y="145" width="165" height="65" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="762" y="173" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">Blockly Workspace</text>
    <text x="762" y="193" font-size="11" fill="#64748B" text-anchor="middle">Program Version Draft</text>
  </g>
  <line x1="845" y1="177" x2="885" y2="177" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- S4: Schematic Simulation -->
  <g filter="url(#shadow)">
    <rect x="890" y="145" width="160" height="65" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="970" y="173" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">Experiment Console</text>
    <text x="970" y="193" font-size="11" fill="#64748B" text-anchor="middle">Schematic Simulation</text>
  </g>
  <line x1="1050" y1="177" x2="1090" y2="177" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- S5: Submission & Feedback -->
  <g filter="url(#shadow)">
    <rect x="1095" y="145" width="130" height="65" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="1160" y="173" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">Submit &amp; View</text>
    <text x="1160" y="193" font-size="11" fill="#64748B" text-anchor="middle">Feedback/Reflection</text>
  </g>

  <!-- ==================== 2. TEACHER FLOW (MIDDLE) ==================== -->
  <rect x="260" y="280" width="980" height="150" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" />
  <text x="280" y="308" font-size="14" font-weight="700" fill="#047857">TEACHER WORKFLOW (WF-02 &amp; WF-04)</text>

  <!-- T1: Teacher Portal -->
  <g filter="url(#shadow)">
    <rect x="285" y="325" width="165" height="65" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="367" y="353" font-size="13" font-weight="600" fill="#064E3B" text-anchor="middle">Teacher Delivery</text>
    <text x="367" y="373" font-size="11" fill="#64748B" text-anchor="middle">Classroom Dashboard</text>
  </g>
  <line x1="450" y1="357" x2="505" y2="357" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- T2: Assignment Authoring -->
  <g filter="url(#shadow)">
    <rect x="510" y="325" width="180" height="65" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="600" y="353" font-size="13" font-weight="600" fill="#064E3B" text-anchor="middle">Assignment Editor</text>
    <text x="600" y="373" font-size="11" fill="#64748B" text-anchor="middle">Rubrics &amp; Guidelines</text>
  </g>
  <line x1="690" y1="357" x2="745" y2="357" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- T3: Publish & Schedule -->
  <g filter="url(#shadow)">
    <rect x="750" y="325" width="180" height="65" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="840" y="353" font-size="13" font-weight="600" fill="#064E3B" text-anchor="middle">Publish Assignment</text>
    <text x="840" y="373" font-size="11" fill="#64748B" text-anchor="middle">Schedule &amp; Deadlines</text>
  </g>
  <line x1="930" y1="357" x2="985" y2="357" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- T4: Review Submissions & Grading -->
  <g filter="url(#shadow)">
    <rect x="990" y="325" width="215" height="65" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="1097" y="353" font-size="13" font-weight="600" fill="#064E3B" text-anchor="middle">Submission Review</text>
    <text x="1097" y="373" font-size="11" fill="#64748B" text-anchor="middle">Rubric Grading &amp; Feedback</text>
  </g>

  <!-- ==================== 3. SCHOOL ADMIN FLOW (BOTTOM) ==================== -->
  <rect x="260" y="470" width="980" height="150" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" />
  <text x="280" y="498" font-size="14" font-weight="700" fill="#B45309">SCHOOL ADMIN WORKFLOW (WF-01)</text>

  <!-- A1: Admin Dashboard -->
  <g filter="url(#shadow)">
    <rect x="285" y="515" width="175" height="65" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
    <text x="372" y="543" font-size="13" font-weight="600" fill="#78350F" text-anchor="middle">School Admin Portal</text>
    <text x="372" y="563" font-size="11" fill="#64748B" text-anchor="middle">Organization Overview</text>
  </g>
  <line x1="460" y1="547" x2="525" y2="547" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- A2: Classrooms List -->
  <g filter="url(#shadow)">
    <rect x="530" y="515" width="190" height="65" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
    <text x="625" y="543" font-size="13" font-weight="600" fill="#78350F" text-anchor="middle">Classroom Management</text>
    <text x="625" y="563" font-size="11" fill="#64748B" text-anchor="middle">Select Class for Allocation</text>
  </g>
  <line x1="720" y1="547" x2="785" y2="547" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- A3: Eligible Robots Modal -->
  <g filter="url(#shadow)">
    <rect x="790" y="515" width="195" height="65" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
    <text x="887" y="543" font-size="13" font-weight="600" fill="#78350F" text-anchor="middle">Eligible Robots View</text>
    <text x="887" y="563" font-size="11" fill="#64748B" text-anchor="middle">Entitled Hardware Status</text>
  </g>
  <line x1="985" y1="547" x2="1045" y2="547" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- A4: Allocation Success -->
  <g filter="url(#shadow)">
    <rect x="1050" y="515" width="170" height="65" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
    <text x="1135" y="543" font-size="13" font-weight="600" fill="#78350F" text-anchor="middle">Robot Allocation</text>
    <text x="1135" y="563" font-size="11" fill="#64748B" text-anchor="middle">Atomic Single Binding</text>
  </g>

  <!-- Legend at Bottom -->
  <g font-size="12" fill="#475569">
    <circle cx="300" cy="665" r="5" fill="#2563EB" />
    <text x="315" y="669">Student Journey</text>
    <circle cx="520" cy="665" r="5" fill="#059669" />
    <text x="535" y="669">Teacher / Instructor Journey</text>
    <circle cx="770" cy="665" r="5" fill="#D97706" />
    <text x="785" y="669">School Admin Governance</text>
    <circle cx="1030" cy="665" r="5" fill="#475569" />
    <text x="1045" y="669">Central Authentication Gate</text>
  </g>
</svg>