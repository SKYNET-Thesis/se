[project]
name = "vista-robot-hardware-adapter"
version = "0.1.0"
description = "Loopback-only, operator-authorized SO-101 hardware calibration adapter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.7",
  "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
