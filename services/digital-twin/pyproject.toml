[project]
name = "vista-digital-twin"
version = "0.1.0"
description = "Offline-only SO-101 joint telemetry foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.7",
  "uvicorn==0.34.3",
  "websockets==17.4",
]

[project.optional-dependencies]
simulation = ["mujoco==3.3.6", "numpy==2.3.3"]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
