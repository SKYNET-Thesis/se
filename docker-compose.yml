services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniarm
      POSTGRES_PASSWORD: omniarm
      POSTGRES_DB: omniarm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./services/backend
    env_file:
      - ./services/backend/.env.example
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - mqtt

  ai-integration:
    build: ./services/ai-integration
    env_file:
      - ./services/ai-integration/.env.example
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "8000:8000"

  education-api:
    build: ./services/education-api
    env_file:
      - ./services/education-api/.env.example
    environment:
      MQTT_HOST: mqtt
      ROBOT_RUNTIME_BASE_URL: http://robot-runtime:8015
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - mqtt
      - robot-runtime

  robot-runtime:
    build: ./services/robot-runtime
    environment:
      VISTA_RUNTIME_TOKEN: local-dev-token
    expose:
      - "8015"

volumes:
  pgdata:
