# Disposable S3-compatible store for local integration tests only.
# It is bound to loopback and keeps object bytes in tmpfs; no AWS resources are used.
services:
  learning-media-minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: vista_media_test
      MINIO_ROOT_PASSWORD: vista_media_test_only_password
    ports:
      - "127.0.0.1:59000:9000"
    tmpfs:
      - /data:size=1g,mode=700
    restart: "no"
